name: CI/CD Pipeline & GitHub Pages Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install dependencies
        run: |
          npm install --legacy-peer-deps
          chmod -R +x node_modules/.bin || true

      - name: 4. Verify & Validate Compact Smart Contract Artifacts
        run: |
          echo "Verifying Compact smart contract contracts/counter.compact..."
          test -f contracts/counter.compact || (echo "Missing counter.compact" && exit 1)
          
          if command -v compact &> /dev/null; then
            compact compile contracts/counter.compact managed/
          else
            echo "Validating committed Compact contract artifacts in managed/ directory..."
            test -d managed/counter || (echo "Missing managed/counter directory" && exit 1)
            test -f managed/counter/contract/index.cjs || (echo "Missing index.cjs" && exit 1)
            test -f managed/counter/contract/index.mjs || (echo "Missing index.mjs" && exit 1)
            test -f managed/counter/contract/index.d.ts || (echo "Missing index.d.ts" && exit 1)
            test -f managed/counter/contract/counter.compact.json || (echo "Missing contract schema JSON" && exit 1)
            test -f managed/counter/keys/counter.pk || (echo "Missing ZK proving key" && exit 1)
            test -f managed/counter/keys/counter.vk || (echo "Missing ZK verification key" && exit 1)
            echo "All committed Compact circuit artifacts and proving key descriptors verified successfully."
          fi

      - name: 5. Run test suite
        run: |
          chmod -R +x node_modules/.bin || true
          npx vitest run

      - name: 6. Build production frontend
        run: |
          chmod -R +x node_modules/.bin || true
          npm run build

      - name: 7. Deploy to gh-pages branch (backup / branch deployment)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: 8. Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
