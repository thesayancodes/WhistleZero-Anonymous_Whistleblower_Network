name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install dependencies
        run: npm install --legacy-peer-deps

      - name: 4. Verify & Validate Compact Smart Contract Artifacts
        run: |
          echo "Verifying Compact smart contract contracts/counter.compact..."
          test -f contracts/counter.compact || (echo "Missing counter.compact" && exit 1)
          
          if command -v compact &> /dev/null; then
            compact compile contracts/counter.compact managed/
          else
            echo "Validating committed Compact contract artifacts in managed/ directory..."
            test -d managed/counter || (echo "Missing managed/counter directory" && exit 1)
            test -f managed/counter/contract/index.cjs || (echo "Missing index.cjs" && exit 1)
            test -f managed/counter/contract/index.mjs || (echo "Missing index.mjs" && exit 1)
            test -f managed/counter/contract/index.d.ts || (echo "Missing index.d.ts" && exit 1)
            test -f managed/counter/contract/counter.compact.json || (echo "Missing contract schema JSON" && exit 1)
            test -f managed/counter/keys/counter.pk || (echo "Missing ZK proving key" && exit 1)
            test -f managed/counter/keys/counter.vk || (echo "Missing ZK verification key" && exit 1)
            echo "All committed Compact circuit artifacts and proving key descriptors verified successfully."
          fi

      - name: 5. Run test suite
        run: npm test

      - name: 6. Build production frontend
        run: npm run build
